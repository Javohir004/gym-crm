spring.datasource.url=jdbc:h2:file:./data/gymdb-prod
# no defaults on purpose: the app must fail to start if they are missing
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=20

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# less exposure in production
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never

logging.level.com.epam.training.gym=INFO

# no public API docs in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

gym.security.jwt.secret=${GYM_JWT_SECRET}