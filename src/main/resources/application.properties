spring.application.name=gym-crm
# default profile; override with --spring.profiles.active=dev
spring.profiles.active=local
server.port=8081

spring.jpa.open-in-view=false
# run data.sql AFTER Hibernate has created the tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Actuator + Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# custom health indicator threshold
gym.health.db-slow-threshold-ms=500

# ---- Security ----
# Override the secret in real environments: GYM_JWT_SECRET (at least 32 characters)
gym.security.jwt.secret=${GYM_JWT_SECRET:gym-crm-dev-only-secret-change-me-in-production-0123456789}
gym.security.jwt.expiration-minutes=60
gym.security.login.max-attempts=3
gym.security.login.block-minutes=5
gym.security.cors.allowed-origins=http://localhost:3000,http://localhost:4200
# ---------- Microservices: trainer-workload-service integration ----------
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Shared only with trainer-workload-service (not the user-login secret). Set WORKLOAD_JWT_SECRET outside
# local runs; the fallback is for local development only.
gym.workload.jwt.secret=${WORKLOAD_JWT_SECRET:local-dev-workload-secret-change-me-0123456789}
gym.workload.jwt.expiration-minutes=5

spring.cloud.openfeign.client.config.trainer-workload-service.connect-timeout=2000
spring.cloud.openfeign.client.config.trainer-workload-service.read-timeout=3000

# Circuit breaker: after 5+ calls with >=50% failures it opens for 30s and calls go straight to the fallback
spring.cloud.circuitbreaker.resilience4j.disable-thread-pool=true
resilience4j.circuitbreaker.instances.trainerWorkload.sliding-window-size=10
resilience4j.circuitbreaker.instances.trainerWorkload.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.trainerWorkload.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.trainerWorkload.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.trainerWorkload.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.trainerWorkload.automatic-transition-from-open-to-half-open-enabled=true
