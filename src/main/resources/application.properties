spring.application.name=gym-crm
# default profile; override with --spring.profiles.active=dev
spring.profiles.active=local
server.port=8081

spring.jpa.open-in-view=false
# run data.sql AFTER Hibernate has created the tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Actuator + Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# custom health indicator threshold
gym.health.db-slow-threshold-ms=500