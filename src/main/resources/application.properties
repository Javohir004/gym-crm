spring.application.name=gym-crm
# default profile; override with --spring.profiles.active=dev
spring.profiles.active=local
server.port=8081

spring.jpa.open-in-view=false
# run data.sql AFTER Hibernate has created the tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Actuator + Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

# custom health indicator threshold
gym.health.db-slow-threshold-ms=500

# ---- Security ----
# Override the secret in real environments: GYM_JWT_SECRET (at least 32 characters)
gym.security.jwt.secret=${GYM_JWT_SECRET:gym-crm-dev-only-secret-change-me-in-production-0123456789}
gym.security.jwt.expiration-minutes=60
gym.security.login.max-attempts=3
gym.security.login.block-minutes=5
gym.security.cors.allowed-origins=http://localhost:3000,http://localhost:4200