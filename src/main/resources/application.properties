# --- Database (H2, in-memory: data lives only while the app runs) ---
db.url=jdbc:h2:mem:gymdb;DB_CLOSE_DELAY=-1
db.driver=org.h2.Driver
db.username=sa
db.password=

# --- Hibernate ---
# create = build the tables from the entities on every startup
hibernate.hbm2ddl.auto=create
hibernate.show_sql=true
hibernate.format_sql=true