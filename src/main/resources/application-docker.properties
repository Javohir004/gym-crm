# Docker Compose uchun profil. Hamma qiymat environment'dan keladi, default yo'q:
# agar yetishmasa, ilova ishga tushmaydi.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# data.sql H2 sintaksisida (MERGE ... KEY), PostgreSQL uchun alohida fayl ishlatamiz
spring.sql.init.data-locations=classpath:data-postgres.sql

logging.level.com.epam.training.gym=INFO