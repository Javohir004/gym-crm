spring.datasource.url=jdbc:h2:file:./data/gymdb-stg
spring.datasource.username=${DB_USERNAME:stg_user}
spring.datasource.password=${DB_PASSWORD:stg_pass}
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

logging.level.com.epam.training.gym=INFO
# broker connection must come from the environment, no defaults
spring.activemq.broker-url=${ACTIVEMQ_URL}
spring.activemq.user=${ACTIVEMQ_USER}
spring.activemq.password=${ACTIVEMQ_PASSWORD}
