# broker connection and service secret must come from the environment, no defaults
spring.activemq.broker-url=${ACTIVEMQ_URL}
spring.activemq.user=${ACTIVEMQ_USER}
spring.activemq.password=${ACTIVEMQ_PASSWORD}
workload.security.jwt.secret=${WORKLOAD_JWT_SECRET}
workload.jms.concurrency=5-20
workload.jms.redelivery-delay-ms=5000
logging.level.com.epam.training.workload=INFO
