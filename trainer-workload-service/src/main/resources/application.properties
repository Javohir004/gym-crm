spring.application.name=trainer-workload-service
server.port=8082

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Shared with gym-crm, which signs the service tokens. Set WORKLOAD_JWT_SECRET outside local runs;
# the fallback is for local development only (HS256 needs at least 32 bytes).
workload.security.jwt.secret=${WORKLOAD_JWT_SECRET:local-dev-workload-secret-change-me-0123456789}
workload.security.jwt.issuer=gym-crm

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ---------- Messaging (local defaults; dev/stg/prod override in their profile files) ----------
spring.activemq.broker-url=${ACTIVEMQ_URL:tcp://localhost:61616}
spring.activemq.user=${ACTIVEMQ_USER:admin}
spring.activemq.password=${ACTIVEMQ_PASSWORD:admin}
workload.jms.queue=trainer.workload
workload.jms.dead-letter-queue=DLQ.trainer.workload
# consumers per instance (min-max); more instances share the same queue
workload.jms.concurrency=3-10
workload.jms.max-attempts=3
workload.jms.redelivery-delay-ms=1000

# ---------- MongoDB (local defaults; stg/prod take the URI from the environment) ----------
spring.data.mongodb.host=${MONGODB_HOST:localhost}
spring.data.mongodb.port=${MONGODB_PORT:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:gym_workload}
spring.data.mongodb.auto-index-creation=true
