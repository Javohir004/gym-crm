spring.application.name=trainer-workload-service
server.port=8082

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Shared with gym-crm, which signs the service tokens. Set WORKLOAD_JWT_SECRET outside local runs;
# the fallback is for local development only (HS256 needs at least 32 bytes).
workload.security.jwt.secret=${WORKLOAD_JWT_SECRET:local-dev-workload-secret-change-me-0123456789}
workload.security.jwt.issuer=gym-crm

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
