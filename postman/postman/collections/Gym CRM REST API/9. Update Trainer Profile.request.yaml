$kind: http-request
url: "{{baseUrl}}/api/trainers/{{trainerUsername}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "{{trainerUsername}}",
      "firstName": "Anna",
      "lastName": "Lee",
      "isActive": true
    }
auth:
  type: bearer
  credentials:
    token: "{{trainerToken}}"
order: 9000
