$kind: http-request
url: "{{baseUrl}}/api/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "{{traineeUsername}}",
      "password": "{{traineePassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      pm.collectionVariables.set('traineeToken', body.token);
    language: text/javascript
order: 3000
